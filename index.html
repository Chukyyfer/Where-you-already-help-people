<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welfare Systems Survey</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe6;color:#283238;font-family:Arial,sans-serif}
.page{min-height:100vh;padding:16px;display:flex;align-items:center;justify-content:center}
.card{width:min(720px,100%);background:#fffdf8;border-radius:26px;padding:clamp(24px,7vw,58px);box-shadow:0 18px 60px #0001}
h1{font-family:Georgia,serif;line-height:1.08;font-size:clamp(36px,7vw,62px);margin:12px 0 20px}
h2{font-family:Georgia,serif;font-size:clamp(28px,5vw,42px);line-height:1.1}
.sub,.lead{font-size:18px;line-height:1.6;color:#65706c}
.tag{font-weight:bold;color:#52766d;font-size:13px;letter-spacing:.3px}
.note{margin:25px 0;padding:16px;border-left:4px solid #52766d;background:#f0f5f1;line-height:1.5}
.note b{display:block;margin-bottom:4px}
label{font-weight:bold;display:block;margin:22px 0 9px}
input,textarea,select{width:100%;padding:15px;border:1px solid #d8d7d0;border-radius:15px;background:#fff;outline:0;font:inherit}
input:focus,textarea:focus,select:focus{border-color:#52766d;box-shadow:0 0 0 4px #52766d18}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.choice{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;margin:9px 0;border:1px solid #deddd6;border-radius:14px;background:#fff;cursor:pointer;font-weight:normal}
.choice input{width:auto;margin-top:3px;accent-color:#52766d}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
button{border:0;border-radius:14px;padding:14px 20px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{background:#426b61;color:#fff}
.secondary{background:#e9e8e2;color:#52605d}
button:disabled{opacity:.55;cursor:not-allowed}
.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#737c78}
.track{height:7px;background:#e5e4dd;border-radius:9px;margin:12px 0 35px;overflow:hidden}
.bar{height:100%;background:#52766d}
.num{color:#52766d;font-weight:bold}
.question h1{font-size:clamp(29px,5vw,45px)}
.hint{font-size:13px;color:#929894}
.error{margin-top:18px;background:#fff0ed;color:#994b40;padding:12px;border-radius:12px}
.success{text-align:center}
.mark{width:70px;height:70px;display:grid;place-items:center;margin:0 auto 22px;border-radius:50%;background:#dfece7;color:#426b61;font-size:35px;font-weight:800}
.footer{text-align:center;color:#8b928f;font-size:20px;margin-top:28px}
.small{font-size:13px;color:#8b928f;line-height:1.5}
.file{padding:12px;background:#f7f6f0;border-radius:14px}
@media(max-width:600px){
.page{align-items:flex-start;padding:12px}.card{border-radius:22px;margin-top:10px;padding:28px 22px}
h1{font-size:47px}.sub,.lead{font-size:16px}.question h1{font-size:32px}
.actions{margin-top:22px}.footer{font-size:20px}
}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
alert("Babel is working");
const {useState,useEffect}=React;
const ENDPOINT="https://formspree.io/f/mrpgekpj";

const general=[
["What best describes your current situation?",["Employed","Self-employed","Student","Unemployed","Retired","Other"]],
["How would you describe your current financial situation?",["Comfortable","Managing, but with some difficulty","Struggling to meet basic needs","Frequently unable to meet basic needs","Prefer not to say"]],
["Have you ever needed financial or welfare assistance before?",["Yes","No"]],
["What do you believe is the biggest challenge preventing people from getting the support they need?",["Lack of money","High cost of living","Lack of access to welfare programmes","Lack of information","Strict eligibility requirements","Other"]]
];

const programmes={
Rental:{
title:"Rental Support",
icon:"🏠",
questions:[
["Do you currently pay rent for your accommodation?",["Yes","No"]],
["How difficult is it for you to meet your current rent obligations?",["Not difficult","Slightly difficult","Moderately difficult","Very difficult","Extremely difficult"]],
["What type of rental assistance would be most useful to you?",["Help paying my current rent","Assistance with a new rental","Rent advance","Assistance with rental deposit","Temporary accommodation support","Other"]],
["How often do you experience difficulty raising your rent when it is due?",["Never","Occasionally","Sometimes","Frequently","Almost every time"]],
["When would you need rental assistance?",["Immediately","Within 1 month","Within 3 months","More than 3 months from now"]]
],
registration:[
["Current housing situation",["Currently renting","About to lose my accommodation","Looking for accommodation","Staying temporarily with family/friends","Other"]],
["Rent payment frequency",["Monthly","Every 3 months","Every 6 months","Yearly","Other"]],
["Approximate annual/current rent amount",["Below ₦100,000","₦100,000–₦300,000","₦300,001–₦500,000","₦500,001–₦1,000,000","Above ₦1,000,000","Prefer not to say"]]
]},
Health:{
title:"Health Support",icon:"🏥",
questions:[
["How would you describe your access to healthcare when you need it?",["Very good","Good","Fair","Poor","Very poor"]],
["What usually makes healthcare difficult to access?",["Cost of treatment","Cost of medication","Consultation fees","Lack of health insurance","Distance to healthcare facilities","Other"]],
["Which type of health support would be most useful to you?",["Medical bills","Medication","Health insurance assistance","Diagnostic tests","Emergency medical support","Preventive healthcare","Other"]],
["Have you or someone in your household ever delayed medical treatment because of cost?",["Yes","No","Prefer not to say"]]
],
registration:[
["Who requires the assistance?",["Myself","My child","My spouse","Parent/guardian","Other family member"]],
["Type of assistance needed",["Medical treatment","Medication","Diagnostic tests","Surgery/procedure","Health insurance assistance","Emergency assistance","Preventive healthcare","Other"]],
["How urgent is the situation?",["Emergency / immediate","Within a few days","Within a few weeks","Not urgent"]]
]},
Education:{
title:"Education Support",icon:"🎓",
questions:[
["Are you currently supporting yourself or someone else through education?",["Yes","No"]],
["What is the biggest educational expense you currently face?",["School fees","Tuition","Books/materials","Accommodation","Transportation","Examination fees","Other"]],
["How difficult is it to meet these educational expenses?",["Not difficult","Slightly difficult","Moderately difficult","Very difficult","Extremely difficult"]],
["What type of education support would help you most?",["Tuition/school fees","Educational materials","Scholarship","Student loan","Accommodation assistance","Transportation assistance","Other"]],
["Have financial difficulties ever affected your education or the education of someone you support?",["Yes","No"]]
],
registration:[
["Who is the education support for?",["Myself","My child","Another person I support"]],
["Level of education",["Primary","Secondary","Vocational/technical","College","Polytechnic","University","Professional training","Other"]],
["Main support needed",["School/tuition fees","Books and learning materials","Examination fees","Accommodation","Transportation","Scholarship","Education loan/support","Other"]]
]},
"Salary Up-front":{
title:"Salary Up-front",
icon:"💰",
questions:[
["Have you ever needed access to part of your expected salary before your normal payday?",["Yes","No"]],
["What would normally cause you to need your salary earlier?",["Rent","Medical expenses","Education expenses","Food/basic needs","Family emergency","Transportation","Unexpected bills","Other"]],
["How useful would access to a portion of your earned salary before payday be?",["Extremely useful","Very useful","Somewhat useful","Not very useful","Not useful at all"]],
["What would be most important to you when using a salary up-front service?",["No interest","Very low service fee","Flexible repayment","Fast access","Privacy","No complicated application process","Other"]]
],
registration:[
["Are you currently employed?",["Yes","No","Self-employed"]],
["How do you normally receive your income?",["Monthly salary","Weekly salary","Irregular income","Other"]],
["Approximately how much would you normally need?",["Below ₦50,000","₦50,000–₦100,000","₦100,001–₦200,000","₦200,001–₦500,000","Above ₦500,000","Not sure"]]
]}
};

function App(){
const [stage,setStage]=useState("intro");
const [generalAns,setGeneralAns]=useState({});
const [selected,setSelected]=useState([]);
const [progIndex,setProgIndex]=useState(0);
const [answers,setAnswers]=useState({});
const [regAnswers,setRegAnswers]=useState({});
const [contact,setContact]=useState({name:"",phone:"",email:"",location:"",contactMethod:"WhatsApp"});
const [idFile,setIdFile]=useState(null);
const [register,setRegister]=useState({});
const [busy,setBusy]=useState(false);
const [err,setErr]=useState("");
const [ref,setRef]=useState("");

const toggle=(p)=>setSelected(x=>x.includes(p)?x.filter(y=>y!==p):[...x,p]);

const start=()=>{setErr("");setStage("general");};

const saveGeneral=(i,v)=>setGeneralAns(x=>({...x,[i]:v}));
const saveProg=(p,i,v)=>setAnswers(x=>({...x,[p+":"+i]:v}));
const saveReg=(p,i,v)=>setRegAnswers(x=>({...x,[p+":"+i]:v}));

function nextGeneral(){
if(!selected.length){setErr("Please select at least one welfare area, or choose “I'm only completing the survey.”");return}
if(selected.includes("Survey only")){setStage("final");return}
setProgIndex(0);setStage("programme");setErr("");
}
function nextProgramme(){
const p=selected[progIndex];
if(progIndex<selected.length-1){setProgIndex(x=>x+1);setErr("");return}
setStage("interest");setErr("");
}
function chooseInterest(v){
setRegister(x=>({...x,[selected[progIndex]]:v}));
if(v==="Yes"){setStage("registration");}
else if(progIndex<selected.length-1){setProgIndex(x=>x+1);setStage("programme");}
else setStage("final");
}
function nextRegistration(){
if(!contact.name.trim()||!contact.phone.trim()||!contact.location.trim()){setErr("Please complete your name, phone number and location.");return}
if(!idFile){setErr("Please upload an ID for registration.");return}
if(progIndex<selected.length-1){setProgIndex(x=>x+1);setStage("programme");setErr("");}
else setStage("consent");
}

async function submit(){
setErr("");setBusy(true);
try{
const f=new FormData();
const reference="WS-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,8).toUpperCase();
f.append("_subject","Welfare Systems — New Survey / Welfare Registration");
f.append("reference_number",reference);
f.append("full_name",contact.name||"Not provided");
f.append("phone",contact.phone||"Not provided");
f.append("email",contact.email||"Not provided");
f.append("location",contact.location||"Not provided");
f.append("preferred_contact",contact.contactMethod);
f.append("selected_programmes",selected.join(", "));
f.append("registration_status",JSON.stringify(register));
general.forEach((q,i)=>f.append("general_"+(i+1),generalAns[i]||"(Not answered)"));
Object.entries(answers).forEach(([k,v])=>f.append("programme_"+k,v||"(Not answered)"));
Object.entries(regAnswers).forEach(([k,v])=>f.append("registration_"+k,v||"(Not answered)"));
if(idFile)f.append("identification_document",idFile);
const r=await fetch(ENDPOINT,{method:"POST",body:f,headers:{Accept:"application/json"}});
if(!r.ok)throw new Error("Formspree could not accept the submission. Please try again.");
setRef(reference);setStage("done");
}catch(e){setErr(e.message||"Something went wrong. Please try again.");}
finally{setBusy(false);}
}

function Footer(){return <div className="footer">© Welfare Systems 2026</div>}

if(stage==="intro")return <main className="page"><section className="card">
<div className="tag">● WELFARE SYSTEMS SURVEY</div>
<h1>Understanding the support people need.</h1>
<p className="sub">This survey is designed to understand where people need practical support and how welfare systems can better support individuals, families and communities.</p>
<div className="note"><b>There are no right or wrong answers.</b>Your responses will help us understand real needs and improve how welfare support is designed.</div>
<button className="primary" onClick={start}>Begin Survey →</button><Footer/>
</section></main>;

if(stage==="general")return <main className="page"><section className="card">
<div className="meta"><span>ABOUT YOU</span><span>1 / {general.length}</span></div>
<h2>A little about your situation</h2>
{general.map((q,i)=><div key={i}><label>{i+1}. {q[0]}</label>{q[1].map(o=><label className="choice" key={o}><input type="radio" name={"g"+i} checked={generalAns[i]===o} onChange={()=>saveGeneral(i,o)}/>{o}</label>)}</div>)}
<label>Which welfare support would you like to explore?</label>
{["Rental","Health","Education","Salary Up-front","Survey only"].map(o=><label className="choice" key={o}><input type="checkbox" checked={selected.includes(o)} onChange={()=>toggle(o)}/>{o==="Survey only"?"I'm only completing the survey":programmes[o]?.title||o}</label>)}
{err&&<div className="error">{err}</div>}
<div className="actions"><button className="secondary" onClick={()=>setStage("intro")}>← Back</button><button className="primary" onClick={nextGeneral}>Continue →</button></div><Footer/>
</section></main>;

if(stage==="programme"){
const p=selected[progIndex],data=programmes[p];
return <main className="page"><section className="card">
<div className="meta"><span>{data.icon} {data.title.toUpperCase()}</span><span>{progIndex+1} / {selected.length}</span></div>
<h2>{data.title}</h2><p className="sub">Help us understand what this kind of support would mean for you.</p>
{data.questions.map((q,i)=><div key={i}><label>{i+1}. {q[0]}</label>{q[1].map(o=><label className="choice" key={o}><input type="radio" name={p+i} checked={answers[p+":"+i]===o} onChange={()=>saveProg(p,i,o)}/>{o}</label>)}</div>)}
{err&&<div className="error">{err}</div>}
<div className="actions"><button className="secondary" onClick={()=>{if(progIndex===0)setStage("general");else {setProgIndex(x=>x-1);setStage("programme")}}}>← Back</button><button className="primary" onClick={nextProgramme}>{progIndex<selected.length-1?"Next support area →":"Continue →"}</button></div><Footer/>
</section></main>;
}

if(stage==="interest"){
const p=selected[progIndex],data=programmes[p];
return <main className="page"><section className="card">
<div className="tag">{data.icon} {data.title.toUpperCase()}</div>
<h2>Would you like to register for {data.title}?</h2>
<p className="sub">Registration lets us collect the information needed to follow up on your interest. It does not guarantee approval or immediate assistance.</p>
<div className="choice" onClick={()=>chooseInterest("Yes")}><input type="radio" readOnly checked={register[p]==="Yes"}/> Yes, I would like to register</div>
<div className="choice" onClick={()=>chooseInterest("No")}><input type="radio" readOnly checked={register[p]==="No"}/> No, I'm only providing survey feedback</div>
<Footer/></section></main>;
}

if(stage==="registration"){
const p=selected[progIndex],data=programmes[p];
return <main className="page"><section className="card">
<div className="tag">REGISTRATION • {data.title.toUpperCase()}</div>
<h2>Welfare Support Registration</h2>
<p className="sub">Please provide the information below so we can follow up on your request.</p>
<label>Full Name *</label><input value={contact.name} onChange={e=>setContact({...contact,name:e.target.value})} placeholder="Your full name"/>
<label>Phone Number *</label><input value={contact.phone} onChange={e=>setContact({...contact,phone:e.target.value})} placeholder="Phone number"/>
<label>Email Address</label><input type="email" value={contact.email} onChange={e=>setContact({...contact,email:e.target.value})} placeholder="Email address"/>
<label>Location / Area *</label><input value={contact.location} onChange={e=>setContact({...contact,location:e.target.value})} placeholder="City / area"/>
<label>Preferred contact method</label><select value={contact.contactMethod} onChange={e=>setContact({...contact,contactMethod:e.target.value})}><option>WhatsApp</option><option>Phone call</option><option>SMS</option><option>Email</option></select>
{data.registration.map((q,i)=><div key={i}><label>{q[0]}</label>{q[1].map(o=><label className="choice" key={o}><input type="radio" name={"r"+p+i} checked={regAnswers[p+":"+i]===o} onChange={()=>saveReg(p,i,o)}/>{o}</label>)}</div>)}
<label>Briefly describe the support you need</label><textarea value={regAnswers[p+":description"]||""} onChange={e=>saveReg(p,"description",e.target.value)} placeholder="Tell us what you need..."></textarea>
<label>Identification document *</label><input className="file" type="file" accept=".jpg,.jpeg,.png,.pdf" onChange={e=>setIdFile(e.target.files[0]||null)}/>
<p className="small">Accepted: JPG, PNG or PDF. Please upload a clear, valid ID. Do not upload passwords, PINs or unrelated documents.</p>
{err&&<div className="error">{err}</div>}
<div className="actions"><button className="secondary" onClick={()=>setStage("interest")}>← Back</button><button className="primary" onClick={nextRegistration}>Continue →</button></div><Footer/>
</section></main>;
}

if(stage==="consent")return <main className="page"><section className="card">
<div className="tag">FINAL CONFIRMATION</div><h2>Ready to submit?</h2>
<p className="sub">Please confirm that you understand what you're submitting.</p>
<label className="choice"><input type="checkbox" id="c1" onChange={e=>setRegister({...register,_c1:e.target.checked})}/> I confirm that the information I have provided is accurate to the best of my knowledge.</label>
<label className="choice"><input type="checkbox" id="c2" onChange={e=>setRegister({...register,_c2:e.target.checked})}/> I understand that registration does not automatically guarantee welfare assistance.</label>
<label className="choice"><input type="checkbox" id="c3" onChange={e=>setRegister({...register,_c3:e.target.checked})}/> I consent to Welfare Systems using the information I provide to process and follow up on my registration.</label>
{err&&<div className="error">{err}</div>}
<div className="actions"><button className="secondary" onClick={()=>setStage("registration")}>← Back</button><button className="primary" disabled={busy||!register._c1||!register._c2||!register._c3} onClick={submit}>{busy?"Sending…":"Submit Survey & Registration"}</button></div><Footer/>
</section></main>;

if(stage==="final")return <main className="page"><section className="card success">
<div className="mark">✓</div><div className="tag">SURVEY COMPLETE</div><h2>Thank you for taking part.</h2><p className="lead">Your survey response has been received. Thank you for helping us understand what welfare support people need.</p><button className="primary" onClick={()=>location.reload()}>Return to Survey</button><Footer/>
</section></main>;

return <main className="page"><section className="card success">
<div className="mark">✓</div><div className="tag">REGISTRATION RECEIVED</div><h2>Your information has been submitted.</h2><p className="lead">Thank you for taking part in the Welfare Systems Survey. Your registration request has been received for review.</p>
<div className="note"><b>Reference Number</b>{ref}</div>
<p className="small">Registration does not automatically guarantee approval or immediate assistance. If further information is required, you may be contacted using the details you provided.</p>
<button className="primary" onClick={()=>location.reload()}>Return to Survey</button><Footer/>
</section></main>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
