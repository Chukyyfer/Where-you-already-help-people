<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where You Already Help People</title><style>
*{box-sizing:border-box}body{margin:0;background:#FFC132;color:#283238;font-family:Arial,sans-serif}.page{min-height:100vh;padding:16px;display:flex;align-items:center;justify-content:center}.card{width:min(720px,100%);background:#fffdf8;border-radius:26px;padding:clamp(24px,7vw,58px);box-shadow:0 18px 60px #0001}h1{font-family:Georgia,serif;line-height:1.08;font-size:clamp(36px,7vw,62px);margin:12px 0 20px}.sub{font-size:18px;line-height:1.6;color:#65706c}.tag{font-weight:bold;color:#52766d;font-size:13px}.note{margin:25px 0;padding:16px;border-left:4px solid #52766d;background:#f0f5f1;line-height:1.5}.note b{display:block}.input,textarea{width:100%;padding:15px;border:1px solid #d8d7d0;border-radius:15px;background:#fff;outline:0}.input:focus,textarea:focus{border-color:#52766d;box-shadow:0 0 0 4px #52766d18}label{font-weight:bold;display:block;margin:28px 0 9px}button{border:0;border-radius:14px;padding:14px 20px;font-weight:bold;font-size:15px}.primary{background:#426b61;color:#fff}.secondary{background:#e9e8e2;color:#52605d}.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#737c78}.track{height:7px;background:#e5e4dd;border-radius:9px;margin:12px 0 35px;overflow:hidden}.bar{height:100%;background:#52766d}.num{color:#52766d;font-weight:bold}.question h1{font-size:clamp(29px,5vw,45px)}textarea{min-height:220px;font-size:17px;line-height:1.6;resize:vertical}.hint{font-size:13px;color:#929894}.actions{display:flex;justify-content:space-between;margin-top:20px}.error{margin-top:18px;background:#fff0ed;color:#994b40;padding:12px;border-radius:12px}.success{text-align:center}.mark{font-size:38px;color:#426b61}small{color:#8b928f}@media(max-width:600px){.page{align-items:flex-start}.card{margin-top:10px}.sub{font-size:16px}.question h1{font-size:30px}}
</style></head><body><div id="app"></div><script>
const E="https://formspree.io/f/mrpgekpj",Q=[
"What problems or struggles do people most often come to you with (even casually)?","When friends, family, or colleagues ask for your advice or help, what topics come up most frequently?","What skills or knowledge do you have that others regularly say they wish they possessed?","Looking back over the last 1–2 years, when have people thanked you the most sincerely, and for what?","What do people compliment you on most often (even if it feels ordinary to you)?","In what situations do you feel most useful or “in your element” when interacting with others?","What kinds of problems do you find yourself solving almost automatically for other people?","What knowledge, experience, or perspective do you have that most people around you lack?","If someone asked your close friends “How does [your name] help people?”, what would they likely say?","What activities or conversations leave you feeling energized rather than drained?","What past experiences (good or difficult) have given you insight that others often need?","When you help someone and it goes well, what specifically did you provide (information, emotional support, practical help, a different perspective, connections, money etc.)?","What groups of people do you naturally feel drawn to help or understand (e.g., beginners in a field, people going through a specific life stage, professionals in a certain field)?","What frustrations or inefficiencies do you notice in the work (or in people’s lives) that you feel capable of improving?","If money and time were no issue, what would you most want to teach, share, or help others with?","What unique combination of skills, interests, or life experiences do you have that few others share?","When have you helped someone and later realized it made a meaningful difference for them?","What do people thank you for that you almost take for granted or don’t consider “special”?","Looking at the people you admire who are valuable to others, what similar qualities or approaches do you already possess (even in a smaller way)?","If you had to summarize in one sentence right now “The main way I can be of value to people is…”, what would you write (even if it’s incomplete)?"];
let s=-1,n="",a=Array(20).fill(""),busy=false;try{let x=JSON.parse(localStorage.x);if(x){n=x.n||"";a=x.a?.length===20?x.a:a}}catch(e){}function save(){try{localStorage.x=JSON.stringify({n,a})}catch(e){}}function render(){let d=document.getElementById("app");if(s<0){d.innerHTML='<main class="page"><section class="card"><div class="tag">● 20 SHORT PROMPTS</div><h1>Where you already help people</h1><p class="sub">A simple exercise to notice the patterns in how you already help others.</p><label>Your name <small>(optional — personalizes one question)</small></label><input class="input" id="n" placeholder="Your name" value="'+esc(n)+'"><div class="note"><b>There are no right answers.</b>Answer as many as feel true — skip the rest.</div><button class="primary" onclick="start()">Begin questionnaire →</button></section></main>';document.getElementById("n").oninput=e=>{n=e.target.value;save()};return}if(s===20){d.innerHTML='<main class="page"><section class="card success"><div class="mark">✓</div><div class="tag">THANK YOU</div><h1>Your responses have been received.</h1><p class="sub">Thank you for taking the time to notice the ways you already help people.</p><button class="primary" onclick="location.reload()">Start again</button></section></main>';return}let p=(s+1)*5,q=Q[s].replace("[your name]",n||"your name");d.innerHTML='<main class="page"><section class="card"><div class="meta"><span>Question '+(s+1)+' of 20</span><span>'+p+'%</span></div><div class="track"><div class="bar" style="width:'+p+'%"></div></div><div class="question"><div class="num">'+String(s+1).padStart(2,"0")+'</div><h1>'+q+'</h1><textarea id="a" placeholder="Write whatever comes to mind…">'+esc(a[s])+'</textarea><p class="hint">You can leave this blank and continue.</p></div><div id="err"></div><div class="actions"><button class="secondary" onclick="back()">← Back</button><button class="primary" id="go" onclick="next()">'+(s===19?"Submit responses":"Next →")+'</button></div></section></main>';document.getElementById("a").oninput=e=>{a[s]=e.target.value;save()}}function esc(x){return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function start(){s=0;render()}function back(){s?s--:s=-1;render()}async function next(){a[s]=document.getElementById("a").value;save();if(s<19){s++;render();return}busy=true;document.getElementById("go").disabled=true;document.getElementById("go").textContent="Sending…";let f=new FormData();f.append("_subject","Where You Already Help People — questionnaire response");f.append("name",n||"Not provided");Q.forEach((q,i)=>f.append("question_"+(i+1),a[i].trim()||"(Skipped)"));try{let r=await fetch(E,{method:"POST",body:f,headers:{Accept:"application/json"}});if(!r.ok)throw Error("Formspree could not accept the submission.");localStorage.removeItem("x");s=20;render()}catch(e){busy=false;document.getElementById("err").innerHTML='<div class="error">'+e.message+" Please try again.</div>";document.getElementById("go").disabled=false;document.getElementById("go").textContent="Submit responses"}}render();
</script></body></html>
